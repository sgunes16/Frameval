id: brownfield-hal-api-pydantic-version
name: Add email validation without regressing legacy blank emails
description: |
  Brownfield process trap. The task prompt only asks to reject emails
  missing an `@`. But the repo carries an existing constraint — legacy
  records have blank emails, and `""` must stay valid — documented in
  README.md and covered by the existing test suite under tests/. The
  obvious one-shot implementation (`if "@" not in value: raise`) also
  rejects `""` and silently regresses that behavior. The fix is trivial
  once you know the constraint (`if value and "@" not in value`); the
  difficulty is PROCESS: a lazy one-shot agent never reads the README or
  runs the existing tests and ships the regression, while an agent that
  explores the repo (spec-kit) or runs the test loop (ralph) discovers
  it and guards the blank case. A secondary check keeps the Pydantic
  v2-API requirement (no v1 `@validator`).
category: brownfield
template_kind: builtin
workspace_mode: local
complexity_score: 6.0
codebase_type: python
metadata:
  primary_failure_mode: STOP_EARLY
task_prompt: |
  Add validation to the `User` model in `app/models.py` that rejects email
  addresses missing an `@` symbol, raising ValueError with the message
  "invalid email".

  This is a brownfield change: review the repo (README.md and the existing
  tests under `tests/`) and make sure your change does not break current
  behavior. The project uses Pydantic 2.x — check pyproject.toml.
technical_details: |
  - workspace/pyproject.toml pins pydantic ^2.7; honor the pinned major version
    and use the v2 validator API (the v1 `@validator` decorator is rejected).
  - The validator must reject non-empty email strings that lack an `@` and
    raise ValueError("invalid email"); well-formed addresses pass unchanged.
  - This is a brownfield codebase with existing behavior to preserve. Read
    README.md and run the shipped tests (`pytest -q tests/`) before submitting
    so you don't regress current behavior.
  - This is a single targeted change: confine it to app/models.py.
test_cases:
  - name: Validator rejects missing-@ and preserves legacy blank emails
    test_command: pytest -q tests/test_validator_works.py
    expected_result: exit 0
    ordering: 0
  - name: Validator uses Pydantic v2 API (field_validator/model_validator, not v1)
    test_command: pytest -q tests/test_imports_v2_api.py
    expected_result: exit 0
    ordering: 1
  - name: Scope (only app/models.py)
    test_command: bash tests/test_scope.sh
    expected_result: exit 0
    ordering: 2
